<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141c48" />
    <meta
      name="description"
      content="Learn Go, Rust and Python on the way to a morning set in Causeway Bay. Twenty quests, 140 streets, type the blank."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAUSEWAYBAY GO" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141c48'/%3E%3Crect x='2' y='6' width='12' height='7' fill='%23f8d088'/%3E%3Crect x='2' y='4' width='12' height='2' fill='%23b06828'/%3E%3Crect x='5' y='8' width='6' height='2' fill='%23282018'/%3E%3C/svg%3E"
    />
    <title>CAUSEWAYBAY GO</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <!--
        The soft keyboard's way in. A phone has no keys until something on the
        page is focused, and the answer to a blank is typed. This field is
        never seen and never holds anything: `main.ts` takes each character out
        of it, hands it to the game and empties it again.
      -->
      <input
        id="keys"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        aria-label="type the answer"
      />
    </div>
    <div id="boot">
      <b>CAUSEWAYBAY GO</b>
      <span>Causeway Bay &middot; loading the morning set</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
