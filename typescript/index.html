<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=overlays-content: the soft keyboard is to cover the
      page, not shrink it. Safari does that anyway; this makes Chrome on
      Android do the same, so main.ts has one case to handle rather than two.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#141c48" />
    <meta
      name="description"
      content="Learn Go, Rust and Python on the way to a morning set in Causeway Bay. Twenty quests, 140 streets, type the blank."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAUSEWAYBAY GO" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141c48'/%3E%3Crect x='2' y='6' width='12' height='7' fill='%23f8d088'/%3E%3Crect x='2' y='4' width='12' height='2' fill='%23b06828'/%3E%3Crect x='5' y='8' width='6' height='2' fill='%23282018'/%3E%3C/svg%3E"
    />
    <title>CAUSEWAYBAY GO</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
    </div>
    <!--
      The soft keyboard's way in. A phone has no keys until something on the
      page is focused, and the answer to a blank is typed. This field is never
      seen: `main.ts` keeps it equal to the answer and types the difference
      whenever the keyboard changes it. It sits outside #stage, pinned to the
      top of the screen, so that when the stage slides up to clear the
      keyboard the focused field stays where the browser can see it and has
      no reason to scroll the page after it.
    -->
    <input
      id="keys"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      enterkeyhint="go"
      aria-label="type the answer"
    />
    <div id="boot">
      <b>CAUSEWAYBAY GO</b>
      <span>Causeway Bay &middot; loading the morning set</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
