[package]
name = "goset-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib as well as cdylib: the cdylib is what wasm-bindgen consumes, the rlib
# is what `cargo test` links against so the quiz can be played headless.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
