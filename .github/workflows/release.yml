# Release — build the game for macOS and attach it to a GitHub release.
#
# Triggered by pushing a tag like `v0.1.0` on main, which must match the
# version of record in ./VERSION (what `make version` prints). Or manually via
# workflow_dispatch for a dry run that uploads the artifacts without creating
# a release.
#
#   goset-<version>.love                       the game, for any OS with LÖVE 11
#   GoSet-<version>-<arch>-apple-darwin.zip    a double-clickable .app with
#                                              LÖVE embedded, signed and
#                                              notarised
#
# The recipe is love2d/Makefile's: `make package` downloads LÖVE, embeds the
# game, builds the icon and signs inside-out; `make notarize` submits to Apple
# and staples. Everything here is credentials and plumbing, so a laptop and a
# tagged release do the same thing.
#
# Signing uses the Developer ID certificate from the repository secrets
# (MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_PASSWORD) and notarization
# uses APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / TEAM_ID. Without the secrets
# the build falls back to ad-hoc signing, so a fork's dry run still produces
# a bundle — one that only opens after a right-click Open.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with ./VERSION is a mistake worth stopping for,
      # not shipping. The bundle is stamped with VERSION, so the two must agree.
      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(make version)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match the version of record $version" >&2
            echo "bump ./VERSION, or retag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      # Imports the Developer ID certificate into a throwaway keychain and
      # exports APPLE_SIGNING_IDENTITY for the build. Falls back to ad-hoc
      # signing when the secret is absent.
      - name: Import codesigning certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 not set, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" || true)
          if [ -n "$CERT_INFO" ]; then
            CERT_ID=$(echo "$CERT_INFO" | head -1 | awk -F'"' '{print $2}')
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
            echo "Found certificate: $CERT_ID"
          else
            echo "::warning::No Developer ID Application certificate found, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # `make package` reads APPLE_SIGNING_IDENTITY, downloads LÖVE, embeds the
      # game, signs inside-out and checks the archive carries every module.
      #
      # The smoke test it normally runs is skipped: it runs the suite inside
      # the bundle, which opens a window, and a runner has no window server to
      # draw into. `verify-archive` still runs and catches a module left out
      # of the archive deterministically; the suite itself runs in test.yml.
      - name: Build and sign
        run: make package SKIP_SMOKE=1

      # Only with a real certificate: Apple refuses an ad-hoc signature.
      - name: Notarize and staple
        if: env.APPLE_SIGNING_IDENTITY != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: make notarize

      # Printed either way: "signed but not notarised" is the state worth
      # seeing in a log.
      - name: Assess with Gatekeeper
        run: make gatekeeper

      - name: Name the archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ steps.version.outputs.arch }}
        run: |
          mkdir -p artifacts
          cp "dist/goset-$VERSION.love" artifacts/
          cp "dist/GoSet-macos.zip" "artifacts/GoSet-$VERSION-$ARCH-apple-darwin.zip"
          ( cd artifacts && shasum -a 256 * > SHA256SUMS )
          cat artifacts/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: goset-macos-${{ steps.version.outputs.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

  release:
    name: Create GitHub release
    needs: [package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            GO SET — learn Go on the way to a morning set.

            | archive | what is inside |
            | --- | --- |
            | `GoSet-…-apple-darwin.zip` | a double-clickable macOS `.app` with LÖVE inside, signed and notarised |
            | `goset-….love` | the game as one archive: `love goset-….love` on any OS with LÖVE 11 |

            Verify a download against `SHA256SUMS`. Progress and settings
            live in `~/.causewaybaygo`.
